<!DOCTYPE html>
<!-- Source for og-image.png. Render at 1200x630:
     see the "og-image" note in README.md for the one-liner. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{
  font-family:"Archivo";font-style:normal;font-weight:100 900;
  src:url(fonts/archivo-latin-wght-normal.woff2) format("woff2-variations");
}
@font-face{
  font-family:"Newsreader";font-style:normal;font-weight:200 800;
  src:url(fonts/newsreader-latin-wght-normal.woff2) format("woff2-variations");
}
@font-face{
  font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;
  src:url(fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations");
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:1200px;height:630px;overflow:hidden;
  background:#101619;
  background-image:linear-gradient(#1a252b 1px,transparent 1px),linear-gradient(90deg,#1a252b 1px,transparent 1px);
  background-size:64px 64px;
  padding:78px 80px;
  display:flex;flex-direction:column;
}
.eyebrow{
  font-family:"JetBrains Mono",monospace;font-size:19px;
  letter-spacing:.24em;text-transform:uppercase;color:#cd7f4d;
}
h1{
  font-family:"Archivo",sans-serif;font-weight:800;
  font-size:118px;line-height:.94;letter-spacing:-.03em;
  text-transform:uppercase;color:#93a2a8;margin-top:34px;
}
.tag{
  font-family:"Newsreader",Georgia,serif;font-size:31px;line-height:1.4;
  color:#cd7f4d;margin-top:30px;max-width:44ch;
}
.chapters{
  margin-top:auto;display:flex;gap:18px;align-items:center;
  font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.06em;
}
.chip{
  border:1px solid #2d3d45;border-left:3px solid #cd7f4d;
  padding:10px 18px;color:#93a2a8;
}
.chip b{color:#e9eff1;font-weight:500;}
.rule{flex:1;height:1px;background:#223038;}
.count{color:#6b797f;}
</style>
</head>
<body>
  <p class="eyebrow">Kurose &amp; Ross &nbsp;·&nbsp; Study guides</p>
  <h1>Computer<br>Networking</h1>
  <p class="tag">A top-down approach, one chapter at a time.</p>
  <div class="chapters">
    <span class="chip">01 &nbsp; <b>The Internet</b></span>
    <span class="chip">02 &nbsp; <b>Application Layer</b></span>
    <span class="rule"></span>
    <span class="count">16 sections</span>
  </div>
</body>
</html>
